[package]
name = "organoids"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.18.1", features = ["wav"] }
bytemuck = { version = "1.24", features = ["derive"] }
rand = { version = "0.9", features = ["small_rng"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
